id: dex
name: Dex
bio: "A former caravan guard stranded at the Dusty Spur after his last outfit was ambushed on the north road. Quiet, dependable, and looking for someone worth following into the wasteland."
tokenColor: "#D97706"
recruitLocationId: dusty_tavern
recruitDialogueId: recruit_greeting
conclusionGoals:
  - investigate_supply_crate
  - check_comm_terminal
  - find_survivor_witness
conclusionQuestId: dex_harland_reckoning
storyStages:
  - id: backstory
    title: "Old Roads"
    triggerCondition:
      type: immediate
    dialogueTreeId: story_backstory
  - id: revelation
    title: "The Ambush"
    triggerCondition:
      type: locationsVisited
      count: 2
    dialogueTreeId: story_revelation
  - id: crisis
    title: "Unfinished Business"
    triggerCondition:
      type: locationsVisited
      count: 4
    dialogueTreeId: story_crisis
  - id: resolution
    title: "What Matters"
    triggerCondition:
      type: locationsVisited
      count: 6
    dialogueTreeId: story_resolution
storyDialogues:
  story_backstory:
    rootNodeId: backstory_start
    nodes:
      - id: backstory_start
        text: "*Dex leans against the wall and stares at the horizon.* You know, I ran the north road for seven years. Crimson Caravan. Best outfit in the valley. We knew every ridge, every ambush point, every safe camp."
        options:
          - id: ask_what_happened
            label: "What happened?"
            next: what_happened
          - id: ask_caravan
            label: "Tell me about the Crimson Caravan."
            next: about_caravan
      - id: about_caravan
        text: "Biggest trade operation west of the Colorado. We moved everything — medicine, ammo, food. Kept the settlements alive. The pay was decent and the company was... well, they were family. The kind you choose."
        options:
          - id: ask_what_happened_2
            label: "So what went wrong?"
            next: what_happened
      - id: what_happened
        text: "Three months ago. Routine run up the north road. Six of us. We'd done it a hundred times. Then the shooting started — from both sides of the ridge. Professional. Coordinated. Not your average raider ambush."
        options:
          - id: ask_survivors
            label: "You were the only survivor?"
            next: survivors
          - id: ask_who
            label: "Who ambushed you?"
            next: who_did_it
      - id: survivors
        text: "*His jaw tightens.* Marco caught the first round. Suki and Hank went down covering the brahmin. Old Pete... Pete tried to pull Suki to cover. He didn't make it. Chen ran west. I don't know if she got out. And me — I took two in the vest and played dead until they left."
        options:
          - id: thats_rough
            label: "I'm sorry, Dex."
            response: "*He nods slowly.* Yeah. Me too. But sorry doesn't find out who set us up."
      - id: who_did_it
        text: "That's what I can't figure out. Raiders don't set up crossfire ambushes. Someone knew our route, our timing. Someone on the inside — or someone who paid well for the information. I've been turning it over in my head for months."
        options:
          - id: find_out
            label: "We'll figure it out. Together."
            response: "*Dex looks at you — really looks at you.* Yeah. Maybe we will."

  story_revelation:
    rootNodeId: revelation_start
    nodes:
      - id: revelation_start
        text: "*Dex pulls you aside, looking troubled.* I've been thinking about the ambush. Talking to people at the places we've visited. And I found something that doesn't add up."
        options:
          - id: what_found
            label: "What did you find?"
            next: what_found
      - id: what_found
        text: "The Crimson Caravan filed an insurance claim the day before our run. The day before. They listed our cargo as 'lost in transit' before we even left the gate. Someone at headquarters knew we weren't coming back."
        options:
          - id: inside_job
            label: "An inside job. The caravan sold you out."
            next: inside_job
          - id: maybe_coincidence
            label: "Could be a clerical error."
            next: not_coincidence
      - id: inside_job
        text: "*Dex nods grimly.* That's what I think too. The cargo was insured for triple its market value. Six people died so someone could collect on a payout. My friends died for caps."
        options:
          - id: who_signed
            label: "Who signed the claim?"
            next: the_name
      - id: not_coincidence
        text: "I thought that too. Wanted to believe it. But insurance claims don't file themselves, and the timing is too clean. Someone at the top authorized it. And I think I know who."
        options:
          - id: who_is_it
            label: "Who?"
            next: the_name
      - id: the_name
        text: "A logistics manager named Harland. He handled all the route planning for our sector. Had access to schedules, cargo manifests, everything. And two weeks after the ambush, he transferred to the Hub office. Promotion. Convenient timing, wouldn't you say?"
        options:
          - id: well_find_him
            label: "We'll find him."
            response: "*Dex's expression hardens.* We will. And when we do, he's going to answer for what he did. One way or another."
          - id: be_careful
            label: "Be careful, Dex. Revenge can consume you."
            response: "*He pauses.* It's not revenge. It's justice. ...But you're not wrong. I'll try to remember the difference."

  story_crisis:
    rootNodeId: crisis_start
    nodes:
      - id: crisis_start
        text: "*Dex is pacing, agitated.* I got word through a trader. Harland isn't in the Hub anymore. He's here. In the valley. Running a new operation out of one of the old settlements. And he's hiring raiders — the same ones who hit us."
        options:
          - id: what_plan
            label: "What do you want to do?"
            next: the_plan
          - id: slow_down
            label: "Slow down. Let's think this through."
            next: think_it_through
      - id: the_plan
        text: "Part of me wants to walk straight in there and put a bullet between his eyes. But that's not who I am. Not who I want to be. The question is — what kind of person are you? Because that's going to decide how this ends."
        options:
          - id: justice_path
            label: "We bring him to justice. Expose what he did."
            next: justice
          - id: confront_path
            label: "We confront him directly. Make him answer for it."
            next: confront
      - id: think_it_through
        text: "You're right. I know you're right. It's just... hearing his name after all this time. Knowing he's out there living well while my friends are in the ground. *He takes a breath.* What do you think we should do?"
        options:
          - id: justice_path_2
            label: "Gather evidence. Turn him over to the NCR."
            next: justice
          - id: confront_path_2
            label: "Face him. But we do it together."
            next: confront
      - id: justice
        text: "*Dex nods slowly.* The right way. Yeah. It'll be harder — but my crew deserved better than a back-alley killing. Let's find proof and make sure everyone knows what Harland did."
        options:
          - id: agreed
            label: "That's the plan. We'll get the evidence."
            response: "*Dex puts a hand on your shoulder.* Thank you. For keeping me straight. Marco would've liked you."
      - id: confront
        text: "*Dex checks his weapon.* Together, then. Not an execution — a reckoning. He looks me in the eye and tells me why. After that... we'll see what happens."
        options:
          - id: ready
            label: "Whenever you're ready."
            response: "*Dex's jaw sets.* I've been ready for three months. Let's finish this."

  story_resolution:
    rootNodeId: resolution_start
    conditionalRoots:
      - karmaMin: 50
        nodeId: resolution_high_karma
    nodes:
      - id: resolution_start
        text: "*Dex sits across from you, quieter than usual.* It's done. Harland's gone — fled the valley when he heard we were coming. Took everything with him. *He stares at his hands.* I spent months chasing a ghost. And now..."
        options:
          - id: it_matters
            label: "It still matters. You know the truth now."
            next: low_karma_ending
          - id: move_on
            label: "Sometimes moving forward is the only option."
            next: low_karma_ending
      - id: low_karma_ending
        text: "*Dex looks around at the wasteland.* You know what I've learned traveling with you? The world takes everything — your friends, your plans, your sense of justice. But it can't take who you choose to be. Even when the choices are ugly. *He stands.* I'm staying. Whatever comes next, I'm in."
        options:
          - id: glad
            label: "Glad to hear it, Dex."
            response: "*He manages a tired smile.* Don't get sentimental on me. We've got work to do."
      - id: resolution_high_karma
        text: "*Dex finds you at dawn, looking more at peace than you've ever seen him.* I got a message from Chen. She's alive. Made it to a settlement east of here. She said someone tipped off the NCR about Harland — anonymous. They arrested him at the border."
        options:
          - id: thats_great
            label: "That's great news, Dex."
            next: high_karma_ending
          - id: chen_alive
            label: "Chen survived? That's incredible."
            next: high_karma_ending
      - id: high_karma_ending
        text: "*Dex's eyes are bright.* I've been carrying this weight for months. And now... Harland's facing trial. Chen's alive. And I found someone worth walking with. *He straightens up.* You showed me something — that doing right matters, even when it's hard. Especially when it's hard. I'm not going anywhere."
        options:
          - id: together
            label: "Together, then. Whatever comes next."
            response: "*Dex grins — a real grin, maybe the first one you've seen.* Together. Now let's go find some trouble worth getting into."

  goal_supply_crate:
    rootNodeId: crate_discovery
    nodes:
      - id: crate_discovery
        text: "*Dex crouches beside the crate, turning something over in his hands. He peels a shipping label free and tucks it into his jacket.* These labels... Crimson Caravan. This is our cargo. The stuff they insured and wrote off. Someone's been moving it through the valley this whole time."
        options:
          - id: ask_meaning
            label: "What does that mean?"
            next: what_it_means
      - id: what_it_means
        text: "It means Harland didn't just arrange the ambush — he set up a whole distribution chain. Our cargo, our friends' cargo, all of it funneled through dummy traders. Dates, route codes, Harland's authorization stamp — it's all on this label. *He pats his jacket pocket.* This is bigger than one crooked logistics manager."
        options:
          - id: keep_digging
            label: "We'll keep digging."
            response: "*Dex nods.* Yeah. Every crate like this is another piece of the puzzle. Thanks for letting me check this out."
          - id: well_get_him
            label: "We'll get him."
            response: "*Dex's expression hardens with purpose.* We will. One crate at a time."

  goal_comm_terminal:
    rootNodeId: terminal_discovery
    nodes:
      - id: terminal_discovery
        text: "*Dex is hunched over the terminal, scrolling through data.* Route logs. Someone was using this terminal to coordinate shipments through the valley — drop points, timing windows, pickup codes. And look at this... *He taps the screen.* A delivery manifest signed 'H. Reeves.' Harland Reeves."
        options:
          - id: ask_what_it_means
            label: "What does that tell us?"
            next: what_it_tells_us
          - id: getting_close
            label: "We're getting close."
            next: close_response
      - id: what_it_tells_us
        text: "It tells us Harland wasn't just skimming off the top — he was running a parallel operation. Using Crimson Caravan infrastructure to move stolen goods while the real shipments got ambushed. The terminal logs show drop points in the valley. He's been here, recently."
        options:
          - id: track_him
            label: "Then we can track him."
            response: "*Dex copies the coordinates onto a scrap of paper.* We're building a case, piece by piece. When this is over, there won't be anywhere left for him to hide."
      - id: close_response
        text: "*Dex nods slowly.* Closer than he knows. These route logs prove he was coordinating from inside the valley. That means he's not some distant exec pulling strings from the Hub — he's local. And local means findable."
        options:
          - id: well_find_him
            label: "We'll find him."
            response: "*Dex's jaw tightens.* Yeah. We will. And he's going to answer for every name on that cargo manifest."

  goal_survivor_witness:
    rootNodeId: witness_found
    nodes:
      - id: witness_found
        text: "*Dex approaches you, shaken.* I just talked to someone — a trader who was at the staging area the night before the ambush. They saw Harland. Saw him meeting with raiders, going over maps. This isn't secondhand rumor anymore. We have a witness."
        options:
          - id: ask_details
            label: "What exactly did they see?"
            next: witness_details
          - id: enough_proof
            label: "That's enough to bring him in."
            next: enough_response
      - id: witness_details
        text: "They said Harland showed up at dusk with two men — not caravan types. Military surplus gear, no insignias. He spread a map on a crate and pointed out the ridge where our convoy would pass the next morning. Told them exactly which wagon carried the high-value cargo. My friends never had a chance."
        options:
          - id: will_testify
            label: "Will they testify?"
            next: testify_response
          - id: thats_it
            label: "That's the last piece. We have everything we need."
            next: everything_response
      - id: testify_response
        text: "*Dex exhales.* They're scared, but they agreed — if we guarantee protection. Between the shipping labels, the terminal logs, and an eyewitness... we've got Harland dead to rights. The question now is what we do with it."
        options:
          - id: together
            label: "Whatever comes next, we decide together."
            response: "*Dex meets your eyes.* Together. Yeah. I wouldn't want to do this with anyone else."
      - id: enough_response
        text: "Enough and then some. Labels, route data, and now a living witness. Three months of carrying this, and the picture is finally complete. *His voice gets quiet.* Marco, Suki, Hank, Pete... this is for all of them."
        options:
          - id: honor_them
            label: "We'll make sure it counts."
            response: "*Dex puts a hand on your shoulder.* It already does. You gave me the chance to see this through. That means everything."
      - id: everything_response
        text: "*Dex takes a breath.* Yeah. Labels. Terminal logs. A witness who can put Harland at the scene. The case is airtight. Now we just need to decide how this ends."
        options:
          - id: your_call
            label: "This has always been your fight. What do you want to do?"
            response: "*Dex is quiet for a long moment.* I want to look him in the eye. But I want to do it right. When I'm ready... I'll need your help. For real this time."

  quest_resolution:
    rootNodeId: resolution_scene
    nodes:
      - id: resolution_scene
        text: "*Dex finds you after the dust settles. He looks different — lighter, somehow. Like something heavy has finally been set down.* It's done. Harland answered for what he did. The evidence we gathered — the labels, the terminal logs, the witness — it all held up. My crew... they got their justice."
        options:
          - id: how_feel
            label: "How do you feel?"
            next: feeling
          - id: deserved
            label: "They deserved that. All of them."
            next: they_deserved
      - id: feeling
        text: "*He's quiet for a moment.* I thought I'd feel... I don't know. Triumphant? Relieved? Mostly I just feel tired. Good tired, though. Like the end of a long haul when you finally see the settlement lights. *He looks at you.* I couldn't have done this without you. Not just the fighting — the believing. You believed me when I was just some stranded guard with a grudge and a theory."
        options:
          - id: never_just
            label: "You were never 'just' anything, Dex."
            next: final_beat
      - id: they_deserved
        text: "*Dex nods slowly.* Marco. Suki. Hank. Old Pete. Maybe Chen, wherever she is — she'll hear about this. *His voice catches.* Seven years on the north road together, and it took three months with you to set things right. That says something about you."
        options:
          - id: team_effort
            label: "It was a team effort."
            next: final_beat
      - id: final_beat
        text: "*Dex straightens up and looks out at the wasteland.* You know what? I think I'm done looking backward. Got a future to figure out now — and I'd like to figure it out with you, if you'll have me. Not because I owe you. Because there's nobody else I'd rather have watching my back."
        options:
          - id: count_on_it
            label: "Count on it."
            response: "*Dex grins — that rare, genuine grin.* Then let's get moving. The wasteland's not going to explore itself."

  conclusion_initiation:
    rootNodeId: dex_approaches
    nodes:
      - id: dex_approaches
        text: "*Dex steps in front of you, blocking the path. His expression is serious — more serious than you've ever seen it.* Hey. Stop. I need to talk to you. Not about the wasteland, not about the next location. About Harland. About finishing this."
        options:
          - id: whats_up
            label: "What's going on, Dex?"
            next: lay_it_out
          - id: im_listening
            label: "I'm listening."
            next: lay_it_out
      - id: lay_it_out
        text: "I've got the shipping labels from the crate. Route logs from the terminal. And a witness who saw Harland planning the whole thing with his own eyes. Three pieces of evidence. Three months of carrying this. It's enough. More than enough."
        options:
          - id: what_now
            label: "So what do you want to do?"
            next: the_ask
      - id: the_ask
        text: "*Dex takes a breath.* I want to go after him. Not alone — not anymore. I'm asking you, straight up: will you help me find Harland and make him answer for what he did to my crew? This isn't a side errand. This is the thing. The real thing."
        options:
          - id: accept
            label: "I'm in. Let's finish this together."
            next: accept_response
          - id: decline
            label: "I can't commit to that right now, Dex."
            next: decline_response
      - id: accept_response
        text: "*Dex's shoulders drop — like he's been bracing for a hit that never came.* You mean that? *He extends his hand.* Then let's do this. I've been carrying this weight alone for too long. With you backing me up... Harland doesn't stand a chance."
        options:
          - id: shake
            label: "Together. Whatever it takes."
            response: "*Dex grips your hand.* Together. *His voice is steady now.* I know where to start. Let me tell you what I've pieced together."
      - id: decline_response
        text: "*Dex's jaw tightens. He looks away for a moment, then back at you.* ...Alright. I hear you. I'm not going to pretend that doesn't sting. But I respect honesty more than empty promises. *He pauses.* The offer stands. If you change your mind, I'll be here."
        options:
          - id: understand
            label: "I understand. And I appreciate what you've shared with me."
            response: "*Dex nods once.* Yeah. *He steps aside.* Let's keep moving. We've still got work to do out here, even if it's not my work."

goals:
  - id: investigate_supply_crate
    target:
      type: tile_type
      tileType: crate
    triggerCondition:
      storyStage: 1
    frequency: once
    playerCanHelp: true
    onComplete:
      dialogueTreeId: goal_supply_crate
      loyaltyDelta: 5
      storyNote: "Dex investigated a supply crate and found Crimson Caravan shipping labels — evidence that stolen cargo from the ambush is still circulating."

  - id: check_comm_terminal
    target:
      type: tile_type
      tileType: terminal
    triggerCondition:
      storyStage: 2
    frequency: once
    playerCanHelp: false
    onComplete:
      dialogueTreeId: goal_comm_terminal
      loyaltyDelta: 5
      storyNote: "Dex found route logs on a comm terminal proving Harland coordinated stolen shipments through the valley using Crimson Caravan infrastructure."

  - id: find_survivor_witness
    target:
      type: npc
      npcId: mara_witness
    triggerCondition:
      storyStage: 3
    frequency: once
    playerCanHelp: false
    onComplete:
      dialogueTreeId: goal_survivor_witness
      loyaltyDelta: 5
      storyNote: "Dex found an eyewitness who saw Harland meeting with raiders the night before the ambush — the final piece of evidence linking him to the attack."

reactions:
  positive:
    - id: pos_1
      text: "Good call. The wasteland needs more people like you."
    - id: pos_2
      text: "That's the kind of thing that keeps me around. Respect."
    - id: pos_3
      text: "You keep surprising me. In a good way."
  negative:
    - id: neg_1
      text: "That wasn't yours to take. You know that, right?"
    - id: neg_2
      text: "I've walked with thieves before. Didn't end well for them."
    - id: neg_3
      text: "Keep this up and I'll have to rethink our arrangement."
  warning: "I'm not going to stick around if this is who you really are. Consider this your last warning."
  farewell: "I signed on because I thought you were different. Guess I was wrong. Good luck out there — you'll need it."
